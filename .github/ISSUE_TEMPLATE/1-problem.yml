name: Report a problem
description: Something in the plugin, a connector or a file in this repository doesn't work as described.
title: "[Problem] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. **Issues are public:** leave out CRM records, call notes, emails and anything that identifies a customer, a deal or a person. Security problems go to security@mgmt-os.ai instead.
  - type: dropdown
    id: where
    attributes:
      label: Where were you working?
      options:
        - Claude (chat, Cowork or mobile)
        - Claude Code
        - Grok
        - Gemini CLI
        - Gemini app or Gemini Enterprise
        - Hermes Agent
        - OpenClaw
        - Cursor, VS Code, GitHub Copilot or Codex
        - Another MCP client
        - Not in an assistant (reading the files)
    validations:
      required: true
  - type: dropdown
    id: what
    attributes:
      label: What were you doing?
      options:
        - Installing or connecting
        - Signing in
        - A deal read (score_deal)
        - A coaching plan (coach_rep)
        - explain_canon or get_usage
        - Using the deal-review or rep-coaching skill
        - Something else
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: The steps, in order. Describe evidence in general terms only.
      placeholder: "1. Added the connector in Claude\n2. Asked it to score a deal with a CRM record and call notes\n3. ..."
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened, and what did you expect?
      description: Include any error message, with customer details removed.
    validations:
      required: true
  - type: input
    id: when
    attributes:
      label: When did it happen?
      description: Date, time and time zone help us find it in our logs.
      placeholder: "Date, time and time zone, for example 9:15 am ET"
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: This issue contains no customer data, deal details or personal information.
          required: true
